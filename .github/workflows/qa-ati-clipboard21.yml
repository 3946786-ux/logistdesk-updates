name: QA ATI single cargo and ADR import (unreleased)
on:
  push:
    branches:
      - qa/ati-one-by-one-21
permissions:
  contents: read
jobs:
  test-ati-clipboard:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6
        shell: pwsh
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Test synthetic ATI cargo parsing
        shell: pwsh
        run: |
          Set-Location builder
          python -m unittest discover -s tests -p "test_ati_import21.py" -v
          if ($LASTEXITCODE -ne 0) { throw "ATI parser failed" }
      - name: Test ATI preview and single cargo selection
        shell: pwsh
        run: |
          Set-Location builder
          python -m unittest discover -s tests -p "test_ati_ui_smoke21.py" -v
          if ($LASTEXITCODE -ne 0) { throw "ATI GUI failed" }
