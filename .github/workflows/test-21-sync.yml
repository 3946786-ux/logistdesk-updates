name: Regression tests for LogistDesk 2.1 sync
on:
  push:
    branches:
      - test/2.1-sync
permissions:
  contents: read
jobs:
  sync-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact application requirements
        shell: pwsh
        run: |
          cd builder
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }
      - name: Compile 2.1 source and run all regression suites
        shell: pwsh
        run: |
          cd builder
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          $tests = @(
            "test_exchange21.py",
            "test_operations_sync21.py",
            "test_exchange_ui21.py",
            "test_app12_smoke_12.py",
            "test_upgrade_20.py",
            "test_partners_12.py"
          )
          foreach ($test in $tests) {
            python -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
