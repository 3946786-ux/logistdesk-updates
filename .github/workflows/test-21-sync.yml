name: Regression tests for LogistDesk 2.1 sync
on:
  push:
    branches:
      - test/2.1-sync
permissions:
  contents: read
jobs:
  sync-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact application requirements
        shell: pwsh
        run: |
          cd builder
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }
      - name: Compile 2.1 source and run encrypted sync tests
        shell: pwsh
        run: |
          cd builder
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          python -m unittest discover -s tests -p test_exchange21.py -v
          if ($LASTEXITCODE -ne 0) { throw "Contact exchange test failed" }
          python -m unittest discover -s tests -p test_operations_sync21.py -v
          if ($LASTEXITCODE -ne 0) { throw "Operations sync test failed" }
          python -m unittest discover -s tests -p test_upgrade_20.py -v
          if ($LASTEXITCODE -ne 0) { throw "Encrypted DB migration regression failed" }
          python -m unittest discover -s tests -p test_partners_12.py -v
          if ($LASTEXITCODE -ne 0) { throw "Partner regression failed" }
